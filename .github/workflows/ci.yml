name: Studio CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Validate public studio
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check structure and public asset boundary
        run: npm run check
      - name: Check asset generation contract
        run: npm run check:asset-gen
      - name: Verify the PBR mutant is rejected
        run: |
          if npm run check:asset-gen -- --mutante=sem-refine; then
            echo "PBR mutant unexpectedly passed"
            exit 1
          fi
          echo "PBR mutant rejected as required"
      - name: Smoke test pack validation
        run: npm run smoke:pack
